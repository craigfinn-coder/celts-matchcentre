<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celtic Match Centre – CeltsAreHere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#017a3e; --green-deep:#013d20; --green-ink:#0b2e1c; --green-soft:#e4f3ea;
    --ink:#101815; --muted:#65736c; --line:#e1e8e4; --bg:#eef2f0; --card:#fff;
    --gold:#d4a72c; --red:#c62828; --yellow:#f2c200;
    --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
    --body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body)}
  .wrap{max-width:720px;margin:0 auto;padding:0 12px 16px}

  /* hoops brand band */
  .brand{margin:0 -12px 12px;background:repeating-linear-gradient(180deg,var(--green) 0 6px,#fff 6px 12px);height:12px}
  .masthead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:2px 2px 10px;flex-wrap:wrap}
  .masthead .wm{font:800 19px/1 var(--display);white-space:nowrap;letter-spacing:.06em;text-transform:uppercase;color:var(--green-deep)}
  .masthead .wm span{color:var(--green)}
  .masthead .upd{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  h2{font:800 15px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--green-deep);margin:0 0 12px;display:flex;align-items:center;gap:8px}
  h2::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--green-soft),transparent)}

  /* scoreboard */
  .board{background:radial-gradient(120% 140% at 50% 0%,#0a8a48 0%,var(--green) 40%,var(--green-deep) 100%);color:#fff;border:0;position:relative;overflow:hidden;padding:18px 16px 16px}
  .board::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 22px,transparent 22px 44px);pointer-events:none}
  .kicker{position:relative;text-align:center;margin:-6px 0 8px}
  .kicker{font:800 12px/1 var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .kicker::before,.kicker::after{content:"";display:inline-block;width:28px;height:1px;background:rgba(255,255,255,.35);vertical-align:middle;margin:0 8px}
  .nextline{position:relative;text-align:center;margin-top:14px;padding-top:10px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;opacity:.9}
  .comp{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;text-align:center;margin-bottom:12px;position:relative}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;position:relative}
  .team{font:800 24px/1.05 var(--display);text-transform:uppercase;letter-spacing:.02em;text-align:center}
  .team.home{text-align:right}.team.away{text-align:left}
  .team{display:flex;flex-direction:column;align-items:center;gap:8px}
  .team.home,.team.away{text-align:center}
  .badge{object-fit:contain;vertical-align:middle}
  .badge.big{width:64px;height:64px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
  .badge.sm{width:20px;height:20px;margin-right:7px;position:relative;top:-1px}
  @media(max-width:400px){.badge.big{width:48px;height:48px}.team{font-size:20px}}
  .team small{display:block;font:600 11px/1.4 var(--body);letter-spacing:.08em;opacity:.7;text-transform:uppercase;margin-top:4px}
  .score{font:800 64px/1 var(--display);letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 6px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .score.flash{animation:flash 1.6s ease-out}
  @keyframes flash{0%{transform:scale(1.25);color:var(--gold)}60%{color:var(--gold)}100%{transform:scale(1);color:#fff}}
  .status{text-align:center;margin-top:12px;font-size:13px;position:relative}
  .pill{display:inline-block;background:rgba(255,255,255,.16);padding:5px 12px;border-radius:999px;font-weight:700;letter-spacing:.02em;backdrop-filter:blur(4px)}
  .pill.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4d;margin-right:7px;box-shadow:0 0 0 0 rgba(255,77,77,.7);animation:pulse 1.4s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
  .ht{opacity:.8;margin-left:10px}
  .countdown{font:800 30px/1 var(--display);letter-spacing:.04em;margin-top:8px;font-variant-numeric:tabular-nums}
  .scorers{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;font-size:13px;line-height:1.6;position:relative}
  .scorers div:first-child{text-align:right}
  .scorers b{font-weight:600}
  .scorers i{font-style:normal;opacity:.75}

  /* events */
  .ev{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
  .ev:first-of-type{border-top:0}
  .ev .min{font:800 18px/1 var(--display);color:var(--green);font-variant-numeric:tabular-nums}
  .ev .who{font-weight:700}
  .ev .sub{color:var(--muted);font-size:13px}
  .ev.away{text-align:right;grid-template-columns:1fr 48px}
  .ev.away .min{order:2;text-align:right}
  .ev.goal{background:linear-gradient(90deg,var(--green-soft),transparent);margin:0 -16px;padding-left:16px;padding-right:16px}
  .ev.goal.away{background:linear-gradient(270deg,var(--green-soft),transparent)}
  .tag{display:inline-block;font:800 11px/1 var(--display);letter-spacing:.08em;padding:4px 7px;border-radius:5px;margin:0 6px 0 0;vertical-align:middle;color:#fff;background:var(--green)}
  .ev.away .tag{margin:0 0 0 6px}
  .tag.card-y{background:var(--yellow);color:#222}.tag.card-r{background:var(--red)}.tag.subs{background:#8a9a91}.tag.var{background:#345}

  /* stats */
  .stat{margin:10px 0}
  .stat .lbl{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;font-size:14px;margin-bottom:4px;font-variant-numeric:tabular-nums}
  .stat .lbl b:last-child{text-align:right}
  .stat .lbl span{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.08em;font-weight:600;padding:0 8px;text-align:center}
  .stat .lbl b{font-weight:700}
  .stat .bar{display:grid;grid-template-columns:1fr 1fr;gap:3px;height:9px}
  .stat .bar span{display:block;height:100%;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
  .stat .bar span i{position:absolute;top:0;bottom:0;background:#a9b6ae;transition:width .6s}
  .stat .bar span:first-child i{right:0}.stat .bar span:last-child i{left:0}
  .stat .bar span.celtic i{background:var(--green)}

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
  th,td{padding:7px 4px;text-align:right;border-top:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;border-top:0}
  td:nth-child(2),th:nth-child(2){text-align:left;width:52%}
  td:first-child{color:var(--muted)}
  tr.celtic td{background:var(--green-soft);font-weight:700;color:var(--green-deep)}
  tr.celtic td:first-child{color:var(--green)}
  .wdl{display:none}
  @media(min-width:480px){.wdl{display:table-cell}}

  .fx{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
  .fx:first-of-type{border-top:0}
  .fx .when{color:var(--muted);font-size:13px;text-align:right}
  .fx b{font-weight:700}
  .foot{color:var(--muted);font-size:12px;text-align:center;padding:6px 0 4px}
  .foot a{color:var(--green);text-decoration:none;font-weight:600}
  /* form chips */
  .form{display:flex;gap:4px;justify-content:center;margin-top:6px}
  .form i{font:800 11px/18px var(--display);width:18px;height:18px;border-radius:4px;text-align:center;color:#fff;background:rgba(255,255,255,.25)}
  .form i.W{background:#2ecc71;color:#063}.form i.L{background:#e74c3c}.form i.D{background:#b5bdb9;color:#222}

  /* pitch */
  .pitchwrap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.pitchwrap{grid-template-columns:1fr}}
  .pitch{position:relative;background:linear-gradient(180deg,#1f8f4e,#177a41);border-radius:10px;padding:10px 6px;min-height:300px;display:flex;flex-direction:column;justify-content:space-between;
    background-image:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 30px,transparent 30px 60px)}
  .pitch::before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.35);border-radius:6px;pointer-events:none}
  .pitch::after{content:"";position:absolute;left:30%;right:30%;top:8px;height:18%;border:2px solid rgba(255,255,255,.35);border-top:0;pointer-events:none}
  .pitch .row{display:flex;justify-content:space-around;position:relative;z-index:1}
  .pitch .pl{display:flex;flex-direction:column;align-items:center;width:64px;text-align:center}
  .pitch .pl b{display:block;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--green-deep);font:800 13px/30px var(--display);box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .pitch .pl.away b{background:#1a1a1a;color:#fff}
  .pitch .pl span{font-size:10.5px;line-height:1.15;color:#fff;margin-top:3px;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.5);max-width:64px}
  .teamhead{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin:0 0 6px;font-size:14px}
  .teamhead small{color:var(--muted);font-weight:600}
  .bench{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.5}
  .bench b{color:var(--ink);font-weight:600}
  .xi-list{font-size:13px;line-height:1.6}

  .statshead{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:-4px 0 6px}
  .statgroup{border-top:1px solid var(--line);padding:4px 0 6px}
  .statgroup summary{cursor:pointer;list-style:none;font:800 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--green-deep);padding:8px 0;display:flex;align-items:center;gap:8px}
  .statgroup summary::-webkit-details-marker{display:none}
  .statgroup summary::before{content:"\25B8";color:var(--green);font-size:12px;transition:transform .15s}
  .statgroup[open] summary::before{transform:rotate(90deg)}
  .statgroup summary small{color:var(--muted);font:600 11px var(--body);letter-spacing:0}
  /* team news, h2h, scorers */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:480px){.cols{grid-template-columns:1fr}}
  .news li{list-style:none;padding:5px 0;border-top:1px solid var(--line);font-size:13.5px}
  .news li:first-child{border-top:0}
  .news ul{margin:0;padding:0}
  .news .why{color:var(--muted);font-size:12px}
  .h2hrow{display:grid;grid-template-columns:70px 1fr auto 1fr;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px}
  .h2hrow:first-of-type{border-top:0}
  .h2hrow .d{color:var(--muted);font-size:12px}
  .h2hrow .s{font:800 16px/1 var(--display);letter-spacing:.04em;padding:2px 8px;border-radius:6px;background:var(--green-soft);color:var(--green-deep)}
  .h2hrow .r{text-align:right}
  .h2hsum{display:flex;justify-content:space-around;text-align:center;margin-bottom:10px}
  .h2hsum b{display:block;font:800 26px/1 var(--display);color:var(--green-deep)}
  .h2hsum span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .showall{display:block;margin:8px auto 0;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:600 12px var(--body);color:var(--green);cursor:pointer}
  .livetag{font:700 10px/1 var(--body);letter-spacing:.08em;background:#ff4d4d;color:#fff;padding:3px 6px;border-radius:4px;margin-left:8px;vertical-align:middle}

  .toast{position:fixed;left:50%;bottom:18px;visibility:hidden;transform:translateX(-50%) translateY(120%);background:var(--green-deep);color:#fff;padding:12px 18px;border-radius:999px;font:800 18px/1 var(--display);letter-spacing:.06em;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:transform .35s;z-index:9}
  .toast.show{visibility:visible;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"></div>
  <div class="masthead"><div class="wm">Celts<span>Are</span>Here <span style="color:var(--muted);font-weight:600;font-size:14px;letter-spacing:.12em">Match Centre</span></div><div class="upd" id="upd">Loading…</div></div>
  <div id="board" class="card board"></div>
  <div id="lineups" class="card" hidden></div>
  <div id="events" class="card" hidden></div>
  <div id="stats" class="card" hidden></div>
  <div id="news" class="card" hidden></div>
  <div id="h2h" class="card" hidden></div>
  <div id="table" class="card" hidden></div>
  <div id="scorers" class="card" hidden></div>
  <div id="next" class="card" hidden></div>
  <div class="foot">Live data: Sportmonks · <a href="https://celtsarehere.com" target="_top">celtsarehere.com</a></div>
</div>
<div id="toast" class="toast"></div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const CELTIC=/celtic/i;
  const CREST={'Celtic':'21/53','St. Mirren':'16/496','Hearts':'26/314','Motherwell':'21/309','Dundee':'28/284','Rangers':'30/62','Hibernian':'2/66','St. Johnstone':'30/734','Dundee United':'26/282','Aberdeen':'17/273','Falkirk':'2/770','Kilmarnock':'20/180'};
  const crest=(name,url)=>url||(CREST[name]?'https://cdn.sportmonks.com/images/soccer/teams/'+CREST[name]+'.png':null);
  const badge=(name,url,cls)=>{const u=crest(name,url);return u?`<img class="badge ${cls||''}" src="${u}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';};
  let lastGood=null, lastScoreKey=null, lastGoalIds=null, firstRender=true;

  const ukDate=(utc,opts)=>new Date(utc.replace(' ','T')+'Z').toLocaleString('en-GB',{timeZone:'Europe/London',...opts});
  const fmtKO=utc=>ukDate(utc,{weekday:'short',day:'numeric',month:'short'})+' · '+ukDate(utc,{hour:'2-digit',minute:'2-digit'});
  const isGoal=t=>(/goal/i.test(t)||/^penalty$/i.test(t.trim()))&&!/disallowed|missed|cancel/i.test(t);
  const tagClass=t=>/yellow/i.test(t)?'card-y':/red/i.test(t)?'card-r':/substitution/i.test(t)?'subs':/var/i.test(t)?'var':'';
  const tagText=t=>/own/i.test(t)?'OWN GOAL':/penalty/i.test(t)&&isGoal(t)?'PEN':isGoal(t)?'GOAL':/yellow/i.test(t)?'YELLOW':/red/i.test(t)?'RED':/substitution/i.test(t)?'SUB':/var/i.test(t)?'VAR':t.toUpperCase().slice(0,6);

  function countdown(utc){
    const ms=new Date(utc.replace(' ','T')+'Z')-Date.now();
    if(ms<=0)return 'Kick-off';
    const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000);
    return (h?h+'h ':'')+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
  }
  const formChips=f=>f&&f.length?'<span class="form">'+f.map(x=>`<i class="${x.r}" title="${esc(x.home)} ${esc(x.score)} ${esc(x.away)}">${x.r}</i>`).join('')+'</span>':'';
  function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),5000);}

  function render(d){
    const fx=d.fixture;
    if(!fx){
      const n=(d.next_fixtures||[])[0];
      $('board').innerHTML='<div class="comp">Celtic Match Centre</div><div class="team" style="text-align:center">No game today</div><div class="status"><span class="pill">'+(n?'Next: '+esc(n.home)+' v '+esc(n.away)+' · '+fmtKO(n.kickoff_utc):'Fixtures to be confirmed')+'</span></div>';
      ['events','stats','lineups','news','h2h'].forEach(i=>$(i).hidden=true);
    }else{
      const live=!!d.live, fin=/^(FT|AET|FT_PEN)$/.test(d.state||''), ns=d.state==='NS'||!d.state;
      let status, extra='';
      if(ns){status='Kick-off '+fmtKO(fx.kickoff_utc);extra=`<div class="countdown" data-ko="${esc(fx.kickoff_utc)}">${countdown(fx.kickoff_utc)}</div>`;}
      else if(d.state==='HT')status='Half time';
      else if(fin)status='Full time · '+ukDate(fx.kickoff_utc,{weekday:'short',day:'numeric',month:'short'});
      else if(live){
        let m=d.minute;
        if(m&&d.updated_at&&!d.added_time){
          const drift=Math.floor((Date.now()-new Date(d.updated_at))/60000);
          const cap=d.state==='INPLAY_1ST_HALF'?45:d.state==='INPLAY_2ND_HALF'?90:999;
          m=Math.min(cap,m+Math.max(0,drift));
        }
        status=(m?m+(d.added_time?'+'+d.added_time:'')+"'":d.state_name)+(d.minute_estimated?' approx':'');
      }else status=d.state_name||d.state;

      const goals=(d.events||[]).filter(e=>isGoal(e.type));
      const list=side=>goals.filter(e=>e.side===side).map(e=>`<b>${esc(e.player)}</b> <i>${e.minute}${e.extra?'+'+e.extra:''}'${/penalty/i.test(e.type)?' pen':''}${/own/i.test(e.type)?' og':''}</i>`).join('<br>');
      const sc=d.score||{home:0,away:0};
      const scoreKey=sc.home+'-'+sc.away;
      const flash=!firstRender&&lastScoreKey!==null&&scoreKey!==lastScoreKey;
      const nextUp=(d.next_fixtures||[]).find(f=>f.id!==fx.id);
      const kicker=fin?'<div class="kicker">Last match</div>':ns?'<div class="kicker">Match day</div>':'';
      const nextLine=fin&&nextUp?`<div class="nextline">Next: <b>${esc(nextUp.home)} v ${esc(nextUp.away)}</b> · ${fmtKO(nextUp.kickoff_utc)}</div>`:'';
      $('board').innerHTML=kicker+
        `<div class="comp">${esc(fx.league||'')}${fx.venue?' · '+esc(fx.venue):''}</div>
         <div class="teams">
           <div class="team home">${badge(fx.home,fx.home_logo,'big')}<span>${esc(fx.home)}<small>Home</small></span>${formChips(d.form&&d.form.home)}</div>
           <div class="score ${flash?'flash':''}">${ns?'v':sc.home+'–'+sc.away}</div>
           <div class="team away">${badge(fx.away,fx.away_logo,'big')}<span>${esc(fx.away)}<small>Away</small></span>${formChips(d.form&&d.form.away)}</div>
         </div>
         <div class="status"><span class="pill ${live?'live':''}">${esc(status)}</span>
           ${d.half_time&&d.half_time.home!=null&&(fin||d.state==='HT'||d.state==='INPLAY_2ND_HALF')?`<span class="ht">HT ${d.half_time.home}–${d.half_time.away}</span>`:''}${extra}</div>
         ${goals.length?`<div class="scorers"><div>${list('home')||'<i>No scorer</i>'}</div><div>${list('away')||'<i>No scorer</i>'}</div></div>`:''}${nextLine}`;

      // goal toast
      const goalIds=goals.map(g=>g.id).join(',');
      if(!firstRender&&lastGoalIds!==null&&goalIds!==lastGoalIds){
        const newest=goals[goals.length-1];
        if(newest)toast((CELTIC.test(newest.team)?'GOAL! ':'Goal: ')+newest.player+' '+newest.minute+"'");
      }
      lastGoalIds=goalIds; lastScoreKey=scoreKey;

      const evsAll=(d.events||[]).slice().reverse();
      const subsN=evsAll.filter(e=>/substitution/i.test(e.type||'')).length;
      const evs=window.__showSubs?evsAll:evsAll.filter(e=>!/substitution/i.test(e.type||''));
      $('events').hidden=!evsAll.length;
      if(evsAll.length){
        $('events').innerHTML='<h2>Key events</h2>'+(subsN?`<button class="showall" style="margin:0 0 8px" onclick="window.__showSubs=!window.__showSubs;window.__rerender&&window.__rerender()">${window.__showSubs?'Hide':'Show'} substitutions (${subsN})</button>`:'')+evs.map(e=>{
          const t=e.type||'', sub=/substitution/i.test(t), g=isGoal(t);
          const who=sub?`<span class="who">${esc(e.player)}</span> <span class="sub">on for ${esc(e.related)}</span>`
                      :`<span class="who">${esc(e.player)}</span>${e.related&&g?` <span class="sub">assist ${esc(e.related)}</span>`:''}${e.result&&g?` <span class="sub">${esc(e.result)}</span>`:''}`;
          const tag=`<span class="tag ${tagClass(t)}">${tagText(t)}</span>`;
          return `<div class="ev ${e.side} ${g?'goal':''}"><span class="min">${e.minute}${e.extra?'+'+e.extra:''}'</span><span>${e.side==='away'?who+tag:tag+who}</span></div>`;
        }).join('');
      }

      const groups=[
        ['Attacking',['Shots Total','Shots On Target','Shots Off Target','Shots Blocked','Shots Insidebox','Big Chances Created','Big Chances Missed','Corners','Offsides','Hit Woodwork']],
        ['Possession & passing',['Ball Possession %','Passes','Successful Passes Percentage','Key Passes','Total Crosses','Accurate Crosses','Successful Dribbles','Long Passes']],
        ['Defending',['Tackles','Interceptions','Saves','Duels Won','Successful Headers','Fouls']],
        ['Discipline',['Yellowcards','Redcards']]
      ];
      const nice=k=>({'Yellowcards':'Yellow cards','Redcards':'Red cards','Ball Possession %':'Possession','Successful Passes Percentage':'Pass accuracy','Shots Insidebox':'Shots in box','Total Crosses':'Crosses','Successful Dribbles':'Dribbles completed','Hit Woodwork':'Hit the woodwork','Big Chances Created':'Big chances','Big Chances Missed':'Big chances missed','Successful Headers':'Headers won','Duels Won':'Duels won','Shots Total':'Shots','Shots On Target':'On target','Shots Off Target':'Off target','Shots Blocked':'Blocked'}[k]||k);
      const have=Object.keys(d.stats||{});
      const sections=groups.map(([title,keys])=>[title,keys.filter(k=>have.includes(k))]).filter(([t,k])=>k.length);
      $('stats').hidden=!sections.length;
      if(sections.length){
        const hc=CELTIC.test(fx.home)?'celtic':'', ac=CELTIC.test(fx.away)?'celtic':'';
        const row=k=>{const h=+d.stats[k].home||0, a=+d.stats[k].away||0, mx=Math.max(h,a)||1, pct=/%/.test(k);
          return `<div class="stat"><div class="lbl"><b>${h}${pct?'%':''}</b><span>${esc(nice(k))}</span><b>${a}${pct?'%':''}</b></div>
            <div class="bar"><span class="${hc}"><i style="width:${h/mx*100}%"></i></span><span class="${ac}"><i style="width:${a/mx*100}%"></i></span></div></div>`;};
        $('stats').innerHTML='<h2>Match stats</h2><div class="statshead"><span>'+esc(fx.home)+'</span><span>'+esc(fx.away)+'</span></div>'+
          sections.map(([title,keys],i)=>`<details class="statgroup" ${i===0?'open':''}><summary>${esc(title)}<small>${keys.length}</small></summary>${keys.map(row).join('')}</details>`).join('');
      }

      // lineups
      const lu=d.lineups, hasXI=lu&&lu.home&&lu.home.xi&&lu.home.xi.length>=11&&lu.away.xi.length>=11;
      $('lineups').hidden=!hasXI;
      if(hasXI){
        const pitch=(side,name,team)=>{
          const rows={}; team.xi.forEach(p=>{const r=p.field&&p.field.includes(':')?+p.field.split(':')[0]:0; (rows[r]=rows[r]||[]).push(p);});
          const ordered=Object.keys(rows).map(Number).sort((a,b)=>a-b);
          const body=ordered.length>=3?`<div class="pitch">${ordered.map(r=>`<div class="row">${rows[r].sort((a,b)=>(+(a.field||'0:0').split(':')[1])-(+(b.field||'0:0').split(':')[1])).map(p=>`<div class="pl ${side}"><b>${p.num??''}</b><span>${esc((p.name||'').split(' ').slice(-1)[0])}</span></div>`).join('')}</div>`).join('')}</div>`
                :`<div class="xi-list">${team.xi.map(p=>`<b>${p.num??''}</b> ${esc(p.name)}`).join('<br>')}</div>`;
          return `<div><div class="teamhead">${badge(name,side==='home'?fx.home_logo:fx.away_logo,'sm')}${esc(name)}<small>${team.formation?esc(team.formation):''}</small></div>${body}
            <div class="bench"><b>Bench:</b> ${team.bench.map(p=>(p.num!=null?p.num+' ':'')+esc(p.name)).join(', ')||'—'}</div></div>`;
        };
        $('lineups').innerHTML='<h2>Lineups</h2><div class="pitchwrap">'+pitch('home',fx.home,lu.home)+pitch('away',fx.away,lu.away)+'</div>';
      }

      // team news (injuries & suspensions)
      const sd=d.sidelined||{}, sh=sd.home||[], sa=sd.away||[];
      $('news').hidden=!(sh.length||sa.length);
      if(sh.length||sa.length){
        const col=(name,list)=>`<div class="news"><div class="teamhead">${esc(name)}</div><ul>${list.length?list.map(x=>`<li><b>${esc(x.player)}</b> <span class="why">${esc(x.type||'')}${x.missed?` · ${x.missed} missed`:''}${x.until?` · back ${ukDate(x.until+' 00:00:00',{day:'numeric',month:'short'})}`:''}</span></li>`).join(''):'<li class="why">No absentees listed</li>'}</ul></div>`;
        $('news').innerHTML='<h2>Team news</h2><div class="cols">'+col(fx.home,sh)+col(fx.away,sa)+'</div>';
      }

      // head to head (results are from the home team's point of view)
      const hh=d.h2h||[];
      $('h2h').hidden=!hh.length;
      if(hh.length){
        const w=hh.filter(x=>x.r==='W').length, l=hh.filter(x=>x.r==='L').length, dr=hh.length-w-l;
        $('h2h').innerHTML='<h2>Head to head</h2>'+`<div class="h2hsum"><div><b>${w}</b><span>${esc(fx.home)} wins</span></div><div><b>${dr}</b><span>Draws</span></div><div><b>${l}</b><span>${esc(fx.away)} wins</span></div></div>`+
          hh.map(x=>`<div class="h2hrow"><span class="d">${ukDate(x.date+' 12:00:00',{day:'numeric',month:'short',year:'2-digit'})}</span><span class="r">${esc(x.home)}</span><span class="s">${esc(x.score)}</span><span>${esc(x.away)}</span></div>`).join('');
      }
    }

    const st=d.standings||[];
    $('table').hidden=!st.length;
    if(st.length){
      $('table').innerHTML='<h2>Premiership'+(d.live_table?'<span class="livetag">AS IT STANDS</span>':'')+'</h2><table><tr><th>#</th><th>Team</th><th>P</th><th class="wdl">W</th><th class="wdl">D</th><th class="wdl">L</th><th>GD</th><th>Pts</th></tr>'+
        st.map(r=>`<tr class="${CELTIC.test(r.team)?'celtic':''}"><td>${r.pos}</td><td>${badge(r.team,r.logo,'sm')}${esc(r.team)}</td><td>${r.p??''}</td><td class="wdl">${r.w??''}</td><td class="wdl">${r.d??''}</td><td class="wdl">${r.l??''}</td><td>${r.gd!=null?(r.gd>0?'+':'')+r.gd:''}</td><td><b>${r.pts}</b></td></tr>`).join('')+'</table>';
    }

    const ts=d.top_scorers||[];
    $('scorers').hidden=!ts.length;
    if(ts.length){
      $('scorers').innerHTML='<h2>Top scorers</h2><table><tr><th>#</th><th>Player</th><th>Goals</th></tr>'+ts.map(r=>`<tr class="${CELTIC.test(r.team||'')?'celtic':''}"><td>${r.pos}</td><td>${esc(r.player)}<span style="color:var(--muted);font-size:12px"> · ${esc(r.team||'')}</span></td><td><b>${r.goals}</b></td></tr>`).join('')+'</table>';
    }

    const nx=(d.next_fixtures||[]).filter(f=>!fx||f.id!==fx.id);
    $('next').hidden=!nx.length;
    if(nx.length){
      $('next').innerHTML='<h2>Coming up</h2>'+nx.map(f=>`<div class="fx"><span>${badge(f.home,f.home_logo,'sm')}<b>${esc(f.home)}</b> v ${badge(f.away,f.away_logo,'sm')}<b>${esc(f.away)}</b><br><span class="sub" style="color:var(--muted);font-size:12px">${esc(f.league||'')}</span></span><span class="when">${fmtKO(f.kickoff_utc)}</span></div>`).join('');
    }
    firstRender=false;
  }

  const ago=iso=>{const s=Math.max(0,Math.round((Date.now()-new Date(iso))/1000));return s<60?'Updated '+s+'s ago':'Updated '+Math.round(s/60)+' min ago';};

  async function load(){
    try{
      // GitHub Pages caches live.json for 10 minutes, so read the file straight from the
      // repository (fresh, CORS-enabled) and fall back to the Pages copy if that fails.
      const RAW='https://raw.githubusercontent.com/craigfinn-coder/celts-matchcentre/main/docs/live.json';
      let r;
      try{ r=await fetch(RAW+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error(r.status); }
      catch(e){ r=await fetch('live.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok)throw new Error(r.status); }
      const d=await r.json();
      lastGood=d; window.__rerender=()=>render(lastGood); render(d);
      $('upd').textContent=ago(d.updated_at);
    }catch(e){
      $('upd').textContent=lastGood?ago(lastGood.updated_at)+' · reconnecting':'Unavailable';
    }
  }
  load();
  setInterval(load,20000);
  setInterval(()=>{
    if(lastGood)$('upd').textContent=ago(lastGood.updated_at);
    const c=document.querySelector('.countdown'); if(c)c.textContent=countdown(c.dataset.ko);
  },1000);
})();
</script>
</body>
</html>
