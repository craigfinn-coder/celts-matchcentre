<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celtic Match Centre – CeltsAreHere</title>
<style>
  :root{
    --green:#016937; --green-dark:#014d28; --green-soft:#e6f2ec;
    --ink:#14201a; --muted:#5f6f66; --line:#dfe6e2; --bg:#f6f8f7; --card:#fff;
    --gold:#c9a227; --red:#c62828; --yellow:#e0b400;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
  h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
  .board{background:linear-gradient(160deg,var(--green),var(--green-dark));color:#fff;border:0}
  .comp{font-size:12px;opacity:.85;text-align:center;margin-bottom:8px}
  .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .team{font-weight:700;font-size:18px;text-align:center;line-height:1.2}
  .team.home{text-align:right}.team.away{text-align:left}
  .score{font-size:44px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .status{text-align:center;margin-top:8px;font-size:13px}
  .pill{display:inline-block;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:999px;font-weight:600}
  .pill.live::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff5252;margin-right:6px;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  .scorers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;font-size:12.5px;opacity:.95}
  .scorers div:first-child{text-align:right}
  .ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:baseline}
  .ev:first-of-type{border-top:0}
  .ev .min{font-weight:700;color:var(--green);font-variant-numeric:tabular-nums}
  .ev .who{font-weight:600}
  .ev .sub{color:var(--muted);font-size:13px}
  .ev.away{text-align:right;grid-template-columns:1fr 44px}
  .ev.away .min{order:2}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;margin-right:6px;vertical-align:middle;color:#fff;background:var(--green)}
  .tag.card-y{background:var(--yellow);color:#222}.tag.card-r{background:var(--red)}.tag.subs{background:#7a8a80}
  .stat{margin:8px 0}
  .stat .lbl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
  .stat .bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
  .stat .bar span{display:block;height:100%}
  .stat .bar .h{background:var(--green)}.stat .bar .a{background:#9aa9a1}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{padding:6px 4px;text-align:right;border-top:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;border-top:0}
  td:nth-child(2),th:nth-child(2){text-align:left;width:60%}
  tr.celtic td{background:var(--green-soft);font-weight:700}
  .fx{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .fx:first-of-type{border-top:0}
  .fx .when{color:var(--muted);font-size:13px}
  .foot{color:var(--muted);font-size:12px;text-align:center;padding:4px 0 10px}
  .empty{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <div id="board" class="card board"></div>
  <div id="events" class="card" hidden></div>
  <div id="stats" class="card" hidden></div>
  <div id="table" class="card" hidden></div>
  <div id="next" class="card" hidden></div>
  <div id="foot" class="foot">Loading…</div>
</div>
<script>
(function(){
  const $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let lastGood=null;

  function fmtKO(utc){
    const d=new Date(utc.replace(' ','T')+'Z');
    return d.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London'});
  }
  function isGoal(t){return /goal/i.test(t)&&!/disallowed|missed/i.test(t)}
  function tagClass(t){
    if(/yellow/i.test(t))return 'card-y'; if(/red/i.test(t))return 'card-r';
    if(/substitution/i.test(t))return 'subs'; return '';
  }
  function tagText(t){
    if(/own/i.test(t))return 'OG'; if(/penalty/i.test(t)&&isGoal(t))return 'PEN';
    if(isGoal(t))return 'GOAL'; if(/yellow/i.test(t))return 'YC'; if(/red/i.test(t))return 'RC';
    if(/substitution/i.test(t))return 'SUB'; if(/var/i.test(t))return 'VAR'; return t.toUpperCase().slice(0,4);
  }

  function render(d){
    const fx=d.fixture;
    if(!fx){
      $('board').innerHTML='<div class="comp">Celtic Match Centre</div><div class="team" style="text-align:center">No Celtic match today</div>';
    }else{
      const live=!!d.live, fin=/^(FT|AET|FT_PEN)$/.test(d.state||'');
      let status;
      if(d.state==='NS'||!d.state) status='Kick-off '+fmtKO(fx.kickoff_utc);
      else if(d.state==='HT') status='Half time';
      else if(fin) status='Full time';
      else if(live) status=(d.minute?d.minute+(d.added_time?'+'+d.added_time:'')+"'":'')+(d.minute_estimated?' (approx)':'')||d.state_name;
      else status=d.state_name||d.state;
      const goals=(d.events||[]).filter(e=>isGoal(e.type));
      const list=side=>goals.filter(e=>e.side===side).map(e=>esc(e.player)+' '+e.minute+"'"+(/penalty/i.test(e.type)?' (pen)':'')+(/own/i.test(e.type)?' (og)':'')).join('<br>');
      $('board').innerHTML=
        `<div class="comp">${esc(fx.league||'')}${fx.venue?' · '+esc(fx.venue):''}</div>
         <div class="teams">
           <div class="team home">${esc(fx.home)}</div>
           <div class="score">${d.score?d.score.home:0}–${d.score?d.score.away:0}</div>
           <div class="team away">${esc(fx.away)}</div>
         </div>
         <div class="status"><span class="pill ${live?'live':''}">${esc(status)}</span>
           ${d.half_time&&d.half_time.home!=null&&d.state!=='NS'?`<span style="opacity:.8;margin-left:8px">HT ${d.half_time.home}–${d.half_time.away}</span>`:''}</div>
         ${goals.length?`<div class="scorers"><div>${list('home')}</div><div>${list('away')}</div></div>`:''}`;

      // events
      const evs=(d.events||[]).slice().reverse();
      $('events').hidden=!(evs.length);
      if(evs.length){
        $('events').innerHTML='<h2>Key events</h2>'+evs.map(e=>{
          const t=e.type||'', sub=/substitution/i.test(t);
          const who=sub?`<span class="who">${esc(e.player)}</span> <span class="sub">on for ${esc(e.related)}</span>`
                      :`<span class="who">${esc(e.player)}</span>${e.related?` <span class="sub">assist ${esc(e.related)}</span>`:''}${e.result?` <span class="sub">${esc(e.result)}</span>`:''}`;
          return `<div class="ev ${e.side}"><span class="min">${e.minute}${e.extra?'+'+e.extra:''}'</span><span><span class="tag ${tagClass(t)}">${tagText(t)}</span>${who}</span></div>`;
        }).join('');
      }

      // stats
      const keys=Object.keys(d.stats||{});
      const order=['Ball Possession %','Shots Total','Shots On Target','Shots Off Target','Corners','Fouls','Offsides','Yellowcards','Redcards','Passes','Successful Passes Percentage','Attacks','Dangerous Attacks','Saves'];
      keys.sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99));
      const shown=keys.filter(k=>!/^(Goals|Assists)$/.test(k));
      $('stats').hidden=!shown.length;
      if(shown.length){
        $('stats').innerHTML='<h2>Match stats</h2>'+shown.map(k=>{
          const h=+d.stats[k].home||0, a=+d.stats[k].away||0, tot=h+a||1;
          return `<div class="stat"><div class="lbl"><span>${h}${/%/.test(k)?'%':''}</span><span>${esc(k.replace('Yellowcards','Yellow cards').replace('Redcards','Red cards'))}</span><span>${a}${/%/.test(k)?'%':''}</span></div>
            <div class="bar"><span class="h" style="width:${h/tot*100}%"></span><span class="a" style="width:${a/tot*100}%"></span></div></div>`;
        }).join('');
      }
    }

    // table
    const st=d.standings||[];
    $('table').hidden=!st.length;
    if(st.length){
      $('table').innerHTML='<h2>Premiership table</h2><table><tr><th>#</th><th>Team</th><th>P</th><th>GD</th><th>Pts</th></tr>'+
        st.map(r=>`<tr class="${r.team==='Celtic'?'celtic':''}"><td>${r.pos}</td><td>${esc(r.team)}</td><td>${r.p??''}</td><td>${r.gd!=null?(r.gd>0?'+':'')+r.gd:''}</td><td>${r.pts}</td></tr>`).join('')+'</table>';
    }

    // next fixtures
    const nx=(d.next_fixtures||[]).filter(f=>!fx||f.id!==fx.id);
    $('next').hidden=!nx.length;
    if(nx.length){
      $('next').innerHTML='<h2>Coming up</h2>'+nx.map(f=>`<div class="fx"><span>${esc(f.home)} v ${esc(f.away)}</span><span class="when">${fmtKO(f.kickoff_utc)}</span></div>`).join('');
    }
  }

  function ago(iso){
    const s=Math.max(0,Math.round((Date.now()-new Date(iso))/1000));
    return s<60?s+'s ago':Math.round(s/60)+' min ago';
  }

  async function load(){
    try{
      const r=await fetch('live.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw new Error(r.status);
      const d=await r.json();
      lastGood=d; render(d);
      $('foot').textContent='Updated '+ago(d.updated_at)+' · Data: Sportmonks';
    }catch(e){
      $('foot').textContent=lastGood?'Updated '+ago(lastGood.updated_at)+' · reconnecting…':'Match centre unavailable right now.';
    }
  }
  load();
  setInterval(load,20000);
  setInterval(()=>{if(lastGood)$('foot').textContent='Updated '+ago(lastGood.updated_at)+' · Data: Sportmonks';},5000);
})();
</script>
</body>
</html>
